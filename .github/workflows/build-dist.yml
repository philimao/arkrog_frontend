# 构建前端并把产物发布到 dist 分支。
# 服务器（国内）从 dist 分支增量拉取，避免开发者跨境上传 26MB 产物。
name: build-dist

on:
  push:
    branches: [teresa-dev]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

# 同一时间只跑一个，避免两次 push 并发推 dist 分支互相打架
concurrency:
  group: build-dist
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 需要往 dist 分支推
    steps:
      - uses: actions/checkout@v4

      # 读 package.json 的 packageManager 字段（pnpm@11.2.2）
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: 发布到 dist 分支
        run: |
          set -euo pipefail
          test -f build/client/index.html
          test -d build/client/assets

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # dist 分支保持线性历史：服务器拉取时 git 只传变化的对象，
          # 图片/字体没变就完全不传。改成 orphan+force-push 会让增量失效。
          if git ls-remote --exit-code --heads origin dist >/dev/null 2>&1; then
            git fetch --depth 1 origin dist
            git worktree add /tmp/dist FETCH_HEAD --detach
            git -C /tmp/dist checkout -B dist
          else
            git worktree add --detach /tmp/dist
            git -C /tmp/dist checkout --orphan dist
            git -C /tmp/dist rm -rfq --cached . 2>/dev/null || true
            find /tmp/dist -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          fi

          rsync -a --delete --exclude '.git' build/client/ /tmp/dist/
          printf 'source_commit=%s\nsource_ref=%s\nbuilt_at=%s\nrun=%s\n' \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" "$(date -u +%FT%TZ)" "$GITHUB_RUN_ID" \
            > /tmp/dist/.build-info

          cd /tmp/dist
          git add -A
          if git diff --cached --quiet; then
            echo "产物无变化，跳过提交"
            exit 0
          fi
          git commit -m "build: ${GITHUB_SHA::7} ($GITHUB_REF_NAME)"
          git push origin dist

      - name: 部署提示
        run: |
          echo "产物已推到 dist 分支。在服务器上执行："
          echo "  sudo -u arkrog /arkrog/bin/deploy-frontend.sh dev --from-git"
          echo "验证 dev 后提升到 prod（不再下载）："
          echo "  sudo -u arkrog /arkrog/bin/deploy-frontend.sh prod --from-dir /arkrog/dev/frontend/current"
